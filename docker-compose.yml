version: '3'
services:
  sales-tracker:
    build: .
    image: sales-tracker
    environment:
      GRAPHQL_SERVER: http://localhost:3000/graphql
      MONGO_URI: mongodb://mongo:27017/sales-tracker
      PORT: 3000
    ports:
      - '80:3000'
    depends_on: [mongo]
  mongo:
    image: mongo
    ports:
      - '27017:27017'
